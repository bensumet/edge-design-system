name: Release

# On main: if there are changesets, open (or update) a "Version packages"
# pull request. When that pull request is merged, publish the new version
# to GitHub Packages and tag it.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@bensumet'
      - run: npm ci
      - run: npm test
      - uses: changesets/action@v1
        with:
          publish: npm run release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
